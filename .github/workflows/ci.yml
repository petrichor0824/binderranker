name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests - Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev]"

      - name: Run test suite
        run: pytest -q

      - name: Run source-checkout doctor
        run: |
          binderranker doctor \
            --project-root "$GITHUB_WORKSPACE"

  package:
    name: Build release assets and clean-install wheel
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel build

      - name: Build distributions
        run: |
          rm -rf dist build src/*.egg-info
          python -m build --outdir dist

      - name: Generate release checksums
        run: |
          (
            cd dist
            sha256sum \
              binderranker-*.whl \
              binderranker-*.tar.gz \
              > SHA256SUMS.txt
          )

      - name: Verify release assets
        run: |
          python scripts/verify_release_assets.py dist

      - name: Install wheel into clean environment
        run: |
          python -m venv /tmp/pda-clean-venv
          /tmp/pda-clean-venv/bin/python \
            -m pip install dist/*.whl

      - name: Verify CLI entry points
        working-directory: /tmp
        run: |
          VERSION="$(
            /tmp/pda-clean-venv/bin/python -c \
              'from importlib.metadata import version; print(version("binderranker"))'
          )"

          test "$(
            /tmp/pda-clean-venv/bin/binderranker --version
          )" = "BinderRanker $VERSION"

          test "$(
            /tmp/pda-clean-venv/bin/protein-design-agent --version
          )" = "BinderRanker $VERSION"

      - name: Verify installed Ranker
        working-directory: /tmp
        run: |
          /tmp/pda-clean-venv/bin/python - <<'PY'
          import protein_design_agent

          from protein_design_agent.tools.run_binderranker import (
              resolve_ranker,
              sha256_file,
          )

          expected = (
              "92d6c02f8ca8f500917f5fa61676fe93"
              "a0acdbb59d49f2cac0c7a74a4a553ed7"
          )

          ranker, manifest_digest = resolve_ranker(
              "v0.1-expert"
          )

          assert ranker.is_file()
          assert manifest_digest == expected
          assert sha256_file(ranker) == expected
          assert "/tmp/pda-clean-venv/" in str(
              protein_design_agent.__file__
          )
          assert "/tmp/pda-clean-venv/" in str(
              ranker
          )

          print(
              "PASS: clean installation can "
              "load the frozen Ranker"
          )
          PY

      - name: Run installed wheel smoke outside repository
        working-directory: /tmp
        run: |
          /tmp/pda-clean-venv/bin/python \
            "$GITHUB_WORKSPACE/scripts/verify_installed_wheel_smoke.py"

      - name: Verify no-argument chat from clean wheel
        working-directory: /tmp
        run: |
          rm -rf /tmp/pda-noarg-chat
          mkdir -p /tmp/pda-noarg-chat
          cd /tmp/pda-noarg-chat

          printf '退出\n' | \
            env -u DEEPSEEK_API_KEY \
            /tmp/pda-clean-venv/bin/binderranker chat \
            > chat-output.txt

          grep -F '模型状态：MISSING_CREDENTIAL' chat-output.txt
          grep -F '网络权限：未允许' chat-output.txt
          grep -F '缺少环境变量：DEEPSEEK_API_KEY' chat-output.txt
          test -f .protein-design-agent/.pda-workspace.json
          test -f \
            .protein-design-agent/configs/models/deepseek.local.yaml

      - name: Initialize clean workspace
        working-directory: /tmp
        run: |
          rm -rf /tmp/pda-clean-workspace

          /tmp/pda-clean-venv/bin/binderranker \
            init \
            --destination /tmp/pda-clean-workspace

      - name: Run workspace doctor
        working-directory: /tmp/pda-clean-workspace
        run: |
          env -u DEEPSEEK_API_KEY \
            PATH=/tmp/pda-clean-venv/bin:/usr/local/bin:/usr/bin:/bin \
            /tmp/pda-clean-venv/bin/binderranker \
            doctor \
            --model-config \
              configs/models/deepseek.local.yaml \
            --profile deepseek_flash
