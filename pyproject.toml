[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "protein-design-agent"
version = "0.1.0"
description = "Evidence-driven backbone ranking and conversational triage for protein design"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"

classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    "numpy>=2.0,<3",
    "openpyxl>=3.1,<4",
    "PyYAML>=6,<7",
    "pydantic>=2,<3",
    "typer>=0.12,<1",
    "biopython>=1.84,<2"
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[project.scripts]
protein-design-agent = "protein_design_agent.cli:app"

[tool.setuptools.package-data]
protein_design_agent = [
    "resources/binderranker/v0.1-expert/*",
    "resources/samples/3c98_small/*.pdb",
    "resources/samples/3c98_small/README.md",
]
