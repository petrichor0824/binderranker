[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "protein-design-agent"
version = "0.1.0"
description = "Configuration-driven protein design and BinderRanker workflow"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "numpy>=2.0,<3",
    "openpyxl>=3.1,<4",
    "PyYAML>=6,<7",
    "pydantic>=2,<3",
    "typer>=0.12,<1",
    "biopython>=1.84,<2"
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[project.scripts]
protein-design-agent = "protein_design_agent.cli:app"

[tool.setuptools.package-data]
protein_design_agent = [
    "resources/binderranker/v0.1-expert/*"
]
