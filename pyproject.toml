[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "binderranker"
version = "0.3.0"
description = "Interpretable ranking and layered screening for generated protein backbone candidates"
readme = "README.md"
authors = [
    { name = "Zheng Hu" }
]
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"

classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    "numpy>=2.0,<3",
    "openpyxl>=3.1,<4",
    "PyYAML>=6,<7",
    "pydantic>=2,<3",
    "typer>=0.12,<1",
    "biopython>=1.84,<2"
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[project.scripts]
binderranker = "protein_design_agent.cli:app"
protein-design-agent = "protein_design_agent.cli:app"

[project.urls]
Homepage = "https://github.com/petrichor0824/binderranker"
Repository = "https://github.com/petrichor0824/binderranker"
Issues = "https://github.com/petrichor0824/binderranker/issues"
Changelog = "https://github.com/petrichor0824/binderranker/blob/main/CHANGELOG.md"

[tool.setuptools.package-data]
protein_design_agent = [
    "resources/binderranker/v0.1-expert/*",
    "resources/samples/3c98_small/*.pdb",
    "resources/samples/3c98_small/README.md",
]
